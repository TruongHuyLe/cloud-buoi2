version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb+srv://huyle_user:Letruonghuy211@cluster0.lzelvpa.mongodb.net/cloud-lab?retryWrites=true&w=majority
    networks:
      - mern-network

  frontend:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: mern-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge